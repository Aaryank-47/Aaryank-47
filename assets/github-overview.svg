<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="190"
  viewBox="0 0 480 190"
  role="img"
  aria-label="GitHub Overview"
>
  <title>GitHub Overview</title>

  <style>
    * { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .title  { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .label  { font-size: 11px; fill: #8b949e; }
    .value  { font-size: 13px; font-weight: 700; fill: #e6edf3; }
    .muted  { fill: #6e7681; }
    .secondary { fill: #8b949e; }
    .animate-bar {
      transform-box: fill-box;
      transform-origin: left;
      animation: barGrow 0.8s ease-out both;
    }
    @keyframes barGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>

  <!-- Card background -->
  <rect width="480" height="190" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Header background -->
  <rect x="1" y="1" width="478" height="53" rx="12" fill="#161b22"/>
  <!-- Square off bottom corners of header -->
  <rect x="1" y="44" width="478" height="9" fill="#161b22"/>

  <!-- Title accent dot -->
  <circle cx="25" cy="26" r="5" fill="#58a6ff"/>

  <!-- Title text -->
  <text class="title" x="41" y="32">GitHub Overview</text>

  <!-- Divider -->
  <line x1="25" y1="52" x2="455" y2="52" stroke="#30363d" stroke-width="1"/>

  <g>
    <text x="96.66666666666667" y="88" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Repositories</text>
    <text x="96.66666666666667" y="112" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1">31</text>
  </g>
<g>
    <text x="240" y="88" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Total Stars</text>
    <text x="240" y="112" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1">0</text>
  </g>
<g>
    <text x="383.33333333333337" y="88" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Total Forks</text>
    <text x="383.33333333333337" y="112" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1">0</text>
  </g>
<g>
    <text x="96.66666666666667" y="156" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Open Issues</text>
    <text x="96.66666666666667" y="180" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1">1</text>
  </g>
<g>
    <text x="240" y="156" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Followers</text>
    <text x="240" y="180" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1">11</text>
  </g>
<g>
    <text x="383.33333333333337" y="156" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Following</text>
    <text x="383.33333333333337" y="180" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle" opacity="1">13</text>
  </g><line x1="168.33333333333334" y1="62" x2="168.33333333333334" y2="176" stroke="#30363d" stroke-width="1" opacity="0.6"/>
<line x1="311.6666666666667" y1="62" x2="311.6666666666667" y2="176" stroke="#30363d" stroke-width="1" opacity="0.6"/>
<line x1="25" y1="136" x2="455" y2="136" stroke="#30363d" stroke-width="1" opacity="0.6"/>
</svg>