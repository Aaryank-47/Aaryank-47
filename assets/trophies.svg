    <path d="M4 6H2V8C2 9.7 3.3 11 5 11V9.2C4.4 8.7 4 7.9 4 7V6Z" fill="#79c0ff" opacity="0.8"/>
    <path d="M20 6H22V7C22 7.9 21.6 8.7 21 9.2V11C22.7 11 24 9.7 24 8V6H20Z" fill="#79c0ff" opacity="0.8"/>
