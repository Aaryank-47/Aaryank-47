<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="190"
  viewBox="0 0 480 190"
  role="img"
  aria-label="Commit Streak"
>
  <title>Commit Streak</title>

  <style>
    * { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .title  { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .label  { font-size: 11px; fill: #8b949e; }
    .value  { font-size: 13px; font-weight: 700; fill: #e6edf3; }
    .muted  { fill: #6e7681; }
    .secondary { fill: #8b949e; }
    .animate-bar {
      transform-box: fill-box;
      transform-origin: left;
      animation: barGrow 0.8s ease-out both;
    }
    @keyframes barGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>

  <!-- Card background -->
  <rect width="480" height="190" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Header background -->
  <rect x="1" y="1" width="478" height="53" rx="12" fill="#161b22"/>
  <!-- Square off bottom corners of header -->
  <rect x="1" y="44" width="478" height="9" fill="#161b22"/>

  <!-- Title accent dot -->
  <circle cx="25" cy="26" r="5" fill="#d29922"/>

  <!-- Title text -->
  <text class="title" x="41" y="32">Commit Streak</text>

  <!-- Divider -->
  <line x1="25" y1="52" x2="455" y2="52" stroke="#30363d" stroke-width="1"/>

  <g>
      <text x="96.66666666666667" y="82" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Current Streak</text>
      <text x="96.66666666666667" y="120" font-size="32" font-weight="700" fill="#d29922" text-anchor="middle" opacity="1">28</text>
      <text x="96.66666666666667" y="140" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">28 days</text>
      <text x="96.66666666666667" y="158" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="middle" opacity="1">Jul 11, 2026 - Aug 7, 2026</text>
    </g>
<g>
      <text x="240" y="82" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Longest Streak</text>
      <text x="240" y="120" font-size="32" font-weight="700" fill="#79c0ff" text-anchor="middle" opacity="1">28</text>
      <text x="240" y="140" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">28 days</text>
      <text x="240" y="158" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="middle" opacity="1">—</text>
    </g>
<g>
    <text x="383.33333333333337" y="82" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">Today</text>
    <text x="383.33333333333337" y="120" font-size="32" font-weight="700" fill="#3fb950" text-anchor="middle" opacity="1">0</text>
    <text x="383.33333333333337" y="140" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="middle" opacity="1">contributions</text>
  </g>
<line x1="168.33333333333334" y1="62" x2="168.33333333333334" y2="176" stroke="#30363d" stroke-width="1" opacity="0.6"/>
<line x1="311.6666666666667" y1="62" x2="311.6666666666667" y2="176" stroke="#30363d" stroke-width="1" opacity="0.6"/>
</svg>