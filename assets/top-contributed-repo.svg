<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="165"
  viewBox="0 0 480 165"
  role="img"
  aria-label="Top Contributed Repository"
>
  <title>Top Contributed Repository</title>

  <style>
    * { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .title  { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .label  { font-size: 11px; fill: #8b949e; }
    .value  { font-size: 13px; font-weight: 700; fill: #e6edf3; }
    .muted  { fill: #6e7681; }
    .secondary { fill: #8b949e; }
    .animate-bar {
      transform-box: fill-box;
      transform-origin: left;
      animation: barGrow 0.8s ease-out both;
    }
    @keyframes barGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>

  <!-- Card background -->
  <rect width="480" height="165" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Header background -->
  <rect x="1" y="1" width="478" height="53" rx="12" fill="#161b22"/>
  <!-- Square off bottom corners of header -->
  <rect x="1" y="44" width="478" height="9" fill="#161b22"/>

  <!-- Title accent dot -->
  <circle cx="25" cy="26" r="5" fill="#39d353"/>

  <!-- Title text -->
  <text class="title" x="41" y="32">Top Contributed Repository</text>

  <!-- Divider -->
  <line x1="25" y1="52" x2="455" y2="52" stroke="#30363d" stroke-width="1"/>

  <g>
      <!-- Repository Card container -->
      <rect x="25" y="66" width="430" height="89" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

      <!-- Repo Title -->
      <text x="39" y="90" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="start" opacity="1">Aaryank-47/TalentForgeAI_Back…</text>

      <!-- Contribution Count Badge -->
      <rect x="320" y="76" width="121" height="22" rx="11" fill="#39d353" opacity="0.15"/>
      <text x="380" y="91" font-size="10" font-weight="700" fill="#39d353" text-anchor="middle" opacity="1">⚡ 277 contribs</text>

      <!-- Description -->
      <text x="39" y="112" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start" opacity="1">AI-powered recruitment platform backend for jobs, candida…</text>

      <!-- Meta Info -->
      <circle cx="39" cy="138" r="4" fill="#3178c6"/>
      <text x="49" y="141" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start" opacity="1">TypeScript</text>
      
      
      <text x="441" y="141" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="end" opacity="1">1d ago</text>
    </g>
</svg>