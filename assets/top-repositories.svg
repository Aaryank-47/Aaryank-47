    <text x="39" y="242" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" opacity="1">Mini-Trading-System-Frontend</text>
    
    <text x="39" y="259" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start" opacity="1">A frontend trading interface built using React.js that co…</text>
