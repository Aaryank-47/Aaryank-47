    <text x="39" y="164" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" opacity="1">TalentForgeAI_FE</text>
    
    
    <circle cx="39" cy="199" r="4" fill="#3178c6"/><text x="49" y="202" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start" opacity="1">TypeScript</text>
    <text x="137" y="202" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="start" opacity="1"></text>
    <text x="441" y="202" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="end" opacity="1">15d ago</text>
