<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="382"
  viewBox="0 0 480 382"
  role="img"
  aria-label="Top Repositories"
>
  <title>Top Repositories</title>

  <style>
    * { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .title  { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .label  { font-size: 11px; fill: #8b949e; }
    .value  { font-size: 13px; font-weight: 700; fill: #e6edf3; }
    .muted  { fill: #6e7681; }
    .secondary { fill: #8b949e; }
    .animate-bar {
      transform-box: fill-box;
      transform-origin: left;
      animation: barGrow 0.8s ease-out both;
    }
    @keyframes barGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>

  <!-- Card background -->
  <rect width="480" height="382" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Header background -->
  <rect x="1" y="1" width="478" height="53" rx="12" fill="#161b22"/>
  <!-- Square off bottom corners of header -->
  <rect x="1" y="44" width="478" height="9" fill="#161b22"/>

  <!-- Title accent dot -->
  <circle cx="25" cy="26" r="5" fill="#58a6ff"/>

  <!-- Title text -->
  <text class="title" x="41" y="32">Top Repositories</text>

  <!-- Divider -->
  <line x1="25" y1="52" x2="455" y2="52" stroke="#30363d" stroke-width="1"/>

  <g>
    <rect x="25" y="66" width="430" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="39" y="86" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" opacity="1">TalentForgeAI_Backend</text>
    
    
    <circle cx="39" cy="121" r="4" fill="#3178c6"/><text x="49" y="124" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start" opacity="1">TypeScript</text>
    <text x="137" y="124" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="start" opacity="1"></text>
    <text x="441" y="124" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="end" opacity="1">10h ago</text>
  </g>
<g>
