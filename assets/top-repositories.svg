    <text x="137" y="358" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="start" opacity="1"></text>
    <text x="441" y="358" font-size="11" font-weight="normal" fill="#6e7681" text-anchor="end" opacity="1">2mo ago</text>
